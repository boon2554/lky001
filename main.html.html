<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>กดปุ่มเพื่อฟังเสียง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff4d6; --ink:#2b1d0e; --sub:#7a6444; --btn:#ff5a36; --btn-ink:#fff; --accent2:#ffb703; --glow:255,140,60; --track:rgba(43,29,14,.12);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#150e0a; --ink:#ffe9c2; --sub:#b99d74; --btn:#ff7a52; --btn-ink:#150e0a; --accent2:#ffcf5c; --glow:255,110,60; --track:rgba(255,233,194,.14); }
}
:root[data-theme="dark"]{ --bg:#150e0a; --ink:#ffe9c2; --sub:#b99d74; --btn:#ff7a52; --btn-ink:#150e0a; --accent2:#ffcf5c; --glow:255,110,60; --track:rgba(255,233,194,.14); }
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Mitr","Noto Sans Thai",system-ui,sans-serif;min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6rem;text-align:center;padding:1.5rem;overflow-x:hidden}
#glow{position:fixed;inset:0;pointer-events:none;opacity:.25;transition:opacity .15s;
  background:radial-gradient(circle at 50% 45%,rgba(var(--glow),.55),rgba(var(--glow),0) 55%)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
h1{position:relative;font-weight:500;font-size:clamp(1.9rem,7vw,3rem);margin:0;line-height:1.2}
#status{position:relative;margin:0;color:var(--sub);font-size:1.05rem;min-height:1.6em}
.stage{position:relative;width:min(48vw,240px);aspect-ratio:1;margin:clamp(3.2rem,12vw,5.5rem) 0}
.pulse{position:absolute;inset:0;transform:scale(var(--p,1))}
.pulse::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--btn);opacity:0;animation:idle 2.6s ease-out infinite}
.playing .pulse::after{animation:none}
@keyframes idle{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.45);opacity:0}}
#btn{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:50%;cursor:pointer;color:var(--btn-ink);
  background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.38),rgba(255,255,255,0) 45%),var(--btn);
  display:grid;place-items:center;box-shadow:0 10px 0 rgba(0,0,0,.2),0 24px 40px rgba(var(--glow),.35);
  transition:transform .12s,box-shadow .12s;-webkit-tap-highlight-color:transparent}
#btn:active{transform:translateY(8px);box-shadow:0 2px 0 rgba(0,0,0,.2),0 8px 20px rgba(var(--glow),.3)}
#btn:focus-visible{outline:4px solid var(--ink);outline-offset:7px}
#btn svg{width:36%;height:auto;fill:currentColor}
.panel{position:relative;width:min(100%,420px);display:grid;gap:1rem}
.time{display:flex;justify-content:space-between;font-size:.95rem;color:var(--sub);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--btn);height:28px;margin:0;cursor:pointer}
.row{display:flex;align-items:center;gap:1rem;justify-content:space-between}
.row label{display:flex;align-items:center;gap:.6rem;flex:1;color:var(--sub);font-size:.95rem}
#loop{font:inherit;font-size:.95rem;border:2px solid var(--track);background:transparent;color:var(--ink);padding:.45rem .9rem;border-radius:99px;cursor:pointer}
#loop[aria-pressed="true"]{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
#loop:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
@media (prefers-reduced-motion: reduce){.pulse::after{animation:none}#btn{transition:none}}
</style>
</head>
<body>
<div id="glow"></div>
<canvas id="fx"></canvas>
<h1>กดปุ่มเพื่อฟังเสียง</h1>
<p id="status" aria-live="polite">แตะที่ปุ่มได้เลย</p>
<div class="stage" id="stage">
  <div class="pulse" id="pulse">
    <button id="btn" type="button" aria-label="เล่นเสียง"><svg id="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></button>
  </div>
</div>
<div class="panel">
  <input id="seek" type="range" min="0" max="1000" value="0" aria-label="เลื่อนตำแหน่งเสียง">
  <div class="time"><span id="cur">0:00</span><span id="dur">0:00</span></div>
  <div class="row">
    <label>ระดับเสียง <input id="vol" type="range" min="0" max="100" value="100" aria-label="ระดับเสียง"></label>
    <button id="loop" type="button" aria-pressed="false">เล่นวน: ปิด</button>
  </div>
</div>

<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var a=$('snd'),btn=$('btn'),st=$('status'),icon=$('icon'),stage=$('stage'),pulse=$('pulse'),glow=$('glow'),
      seek=$('seek'),cur=$('cur'),dur=$('dur'),vol=$('vol'),loop=$('loop'),cv=$('fx'),g=cv.getContext('2d');
  var PLAY='<path d="M8 5v14l11-7z"/>',PAUSE='<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var ac,an,buf,dragging=false,W=0,H=0,dpr=1,parts=[],lastBeat=0,C={};
  function fmt(s){return isFinite(s)?Math.floor(s/60)+':'+('0'+Math.floor(s%60)).slice(-2):'0:00'}
  function colors(){var s=getComputedStyle(document.documentElement);C.a=s.getPropertyValue('--btn').trim();C.b=s.getPropertyValue('--accent2').trim();C.t=s.getPropertyValue('--track').trim()}
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change',colors);colors();
  function size(){dpr=window.devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0)}
  addEventListener('resize',size);size();

  function initAudio(){
    if(ac)return;
    try{var AC=window.AudioContext||window.webkitAudioContext;ac=new AC();var src=ac.createMediaElementSource(a);
      an=ac.createAnalyser();an.fftSize=256;an.smoothingTimeConstant=.78;src.connect(an);an.connect(ac.destination);
      buf=new Uint8Array(an.frequencyBinCount);}catch(e){an=null}
  }
  function burst(x,y,n,R,speed){
    if(reduce)return;
    for(var i=0;i<n;i++){var t=Math.random()*6.283,v=(speed||5)*(.4+Math.random());
      parts.push({x:x+Math.cos(t)*(R||0),y:y+Math.sin(t)*(R||0),vx:Math.cos(t)*v,vy:Math.sin(t)*v-1,l:1,s:2+Math.random()*4,c:Math.random()<.5?C.a:C.b})}
  }
  function center(){var r=stage.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2,R:r.width/2}}
  function ui(on){document.body.classList.toggle('playing',on);icon.innerHTML=on?PAUSE:PLAY;btn.setAttribute('aria-label',on?'หยุดชั่วคราว':'เล่นเสียง')}

  function toggle(){
    initAudio();if(ac&&ac.state==='suspended')ac.resume();
    var c=center();burst(c.x,c.y,36,c.R*.9,6);
    try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}
    if(a.paused){if(a.ended)a.currentTime=0;var p=a.play();if(p&&p.catch)p.catch(function(){ui(false);st.textContent='เล่นเสียงไม่ได้ ลองกดอีกครั้ง'})}
    else a.pause();
  }
  btn.addEventListener('click',toggle);
  document.addEventListener('keydown',function(e){
    if(e.code==='Space'&&!/^(BUTTON|INPUT)$/.test(document.activeElement.tagName)){e.preventDefault();toggle()}
  });
  a.addEventListener('play',function(){ui(true);st.textContent='กำลังเล่นเสียง…'});
  a.addEventListener('pause',function(){ui(false);if(!a.ended)st.textContent='หยุดชั่วคราว กดเพื่อเล่นต่อ'});
  a.addEventListener('ended',function(){ui(false);st.textContent='เล่นจบแล้ว กดอีกครั้งเพื่อเล่นใหม่'});
  a.addEventListener('loadedmetadata',function(){dur.textContent=fmt(a.duration)});
  a.addEventListener('durationchange',function(){dur.textContent=fmt(a.duration)});
  seek.addEventListener('input',function(){dragging=true;if(isFinite(a.duration))a.currentTime=seek.value/1000*a.duration});
  seek.addEventListener('change',function(){dragging=false});
  vol.addEventListener('input',function(){a.volume=vol.value/100});
  loop.addEventListener('click',function(){a.loop=!a.loop;loop.setAttribute('aria-pressed',a.loop);loop.textContent='เล่นวน: '+(a.loop?'เปิด':'ปิด')});

  var N=72;
  function frame(t){
    g.clearRect(0,0,W,H);
    var c=center(),R=c.R,playing=!a.paused&&!a.ended,bass=0,i,v;
    if(an&&playing){an.getByteFrequencyData(buf);for(i=0;i<6;i++)bass+=buf[i];bass=bass/6/255}
    else if(playing){bass=.4+.3*Math.sin(t/180)}
    // progress ring
    var prog=isFinite(a.duration)&&a.duration>0?a.currentTime/a.duration:0;
    g.lineCap='round';g.lineWidth=4;
    g.strokeStyle=C.t;g.beginPath();g.arc(c.x,c.y,R+9,0,6.283);g.stroke();
    if(prog>0){g.strokeStyle=C.b;g.beginPath();g.arc(c.x,c.y,R+9,-1.5708,-1.5708+prog*6.283);g.stroke()}
    // radial bars
    g.lineWidth=Math.max(3,R*.045);
    for(i=0;i<N;i++){
      var k=i<N/2?i:N-1-i;
      if(an&&playing)v=buf[Math.floor(k*1.35)+1]/255;
      else if(playing)v=.25+.25*Math.sin(t/160+k*.6);
      else v=0;
      var len=R*.07+v*R*.5,ang=i/N*6.283-1.5708,r0=R+20;
      g.strokeStyle=i%2?C.a:C.b;g.globalAlpha=.55+v*.45;
      g.beginPath();g.moveTo(c.x+Math.cos(ang)*r0,c.y+Math.sin(ang)*r0);g.lineTo(c.x+Math.cos(ang)*(r0+len),c.y+Math.sin(ang)*(r0+len));g.stroke();
    }
    g.globalAlpha=1;
    if(playing&&bass>.72&&t-lastBeat>180){lastBeat=t;burst(c.x,c.y,6,R+22,3.5)}
    // particles
    for(i=parts.length-1;i>=0;i--){var p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.vx*=.985;p.l-=.016;
      if(p.l<=0){parts.splice(i,1);continue}
      g.globalAlpha=p.l;g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,p.s*p.l+.5,0,6.283);g.fill()}
    g.globalAlpha=1;
    // pulse + glow + time
    if(!reduce)pulse.style.setProperty('--p',(1+bass*.07).toFixed(3));
    glow.style.opacity=(.22+bass*.7).toFixed(2);
    cur.textContent=fmt(a.currentTime);
    if(!dragging&&prog>=0)seek.value=Math.round(prog*1000);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
